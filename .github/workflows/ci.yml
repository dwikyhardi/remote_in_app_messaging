name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: fvm flutter pub get
      - run: fvm flutter analyze --no-pub
      - run: fvm flutter test --no-pub
      - name: Analyze example
        run: fvm flutter analyze --no-pub
        working-directory: example
      - name: Validate package for publishing
        run: fvm flutter pub publish --dry-run
